build:
  clean_command: ''
  release:
    binary_path: program
    command: cc -g -fno-omit-frame-pointer -fstack-protector-all -fPIE -pie -Wl,-z,relro,-z,now
      main.c -o program
  sanitized:
    binary_path: program
    command: clang -fsanitize=address,undefined -g -fno-omit-frame-pointer -fstack-protector-all
      -fPIE -pie -Wl,-z,relro,-z,now main.c -o program
execution:
  environment_variables:
    ASAN_OPTIONS: detect_leaks=0
    UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
  image: diffsheriff:code-audit
  input_method: stdin
  timeout_seconds: 5
hardening_baseline:
  min_relro: partial
target:
  base_ref: 9a20effa6be1b17a2f4fd572dc9fb20ae76c4566
  baseline_signature:
    error_type: heap-buffer-overflow
    file: source.c
    function: parse
    line: 8
  language: c
  name: sample
  patch_ref: ba1c08b78352d92c97b6e430a72b1c5d06fc043c
  repository_path: repository
test_suites:
  boundary_directory: tests/boundary
  expectations: expected.json
  malicious_directory: tests/invalid
  provenance: Independent test specification
  valid_directory: tests/valid
version: '2.0'
