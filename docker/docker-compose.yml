services:
  diffsheriff:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ..:/workspace
    working_dir: /workspace
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    cpus: 2.0
    mem_limit: 2048M
    pids_limit: 256
    command: ["--help"]
