# Build the local runtime image. Invoke DiffSheriff on the host; it launches
# restricted child containers itself. Do not mount the Docker socket in targets.
services:
  runtime:
    image: diffsheriff:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2.0
    mem_limit: 2048m
    pids_limit: 128
    command: [--help]
