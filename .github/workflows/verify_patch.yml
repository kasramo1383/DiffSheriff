name: DiffSheriff Verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  target-patch:
    if: github.event_name != 'pull_request' && vars.DIFFSHERIFF_TARGET_CONFIG != ''
    uses: ./.github/workflows/validate_target.yml
    with:
      config: ${{ vars.DIFFSHERIFF_TARGET_CONFIG }}
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q tests/
      - run: black --check diffsheriff tests
      - run: flake8 diffsheriff tests
  native-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - run: docker build -t diffsheriff:local -f docker/Dockerfile .
      - name: Execute harmless native matrix
        env:
          DIFFSHERIFF_DOCKER_TESTS: '1'
        run: |
          mkdir -p .diffsheriff
          python -m pytest -q tests/test_container_integration.py --basetemp=.diffsheriff/ci-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-validation-evidence
          path: .diffsheriff/ci-tests
          include-hidden-files: true
