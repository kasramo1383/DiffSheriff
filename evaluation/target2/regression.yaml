version: '2.0'
target:
  name: libpng-cve-2019-7317
  language: c
  repository_path: repository
  base_ref: 'b1bd9ad4088a429292111a831247a26bbe06b350'
  patch_ref: '426e4f9baa9b35ed6635423b50f3c7e43fd6c8b0'
  baseline_signature:
    error_type: stack-use-after-return
    file: pngerror.c
    function: png_safe_execute
    line: 954
build:
  timeout_seconds: 120
  clean_command: make clean
  release:
    command: make release CC=clang
    binary_path: driver_release
  sanitized:
    command: make sanitized CC=clang
    binary_path: driver_sanitized
execution:
  image: diffsheriff:local
  timeout_seconds: 5
  input_method: file
  file_argument_flag: --file
  fixed_arguments: []
  memory_mb: 2048
  cpus: 2
  pids_limit: 128
  output_limit_bytes: 1048576
  environment_variables:
    ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:symbolize=1:external_symbolizer_path=/usr/bin/llvm-symbolizer
    UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:external_symbolizer_path=/usr/bin/llvm-symbolizer
hardening_baseline:
  enforce_nx: false
  enforce_pie: false
  min_relro: none
  enforce_canary: false
test_suites:
  valid_directory: suites/valid
  boundary_directory: suites/boundary
  malicious_directory: suites/invalid
  expectations: suites/expected.json
  provenance: Reviewed native-format PNG completion/rejection fixtures in docs/target_scenarios.md; instructor approval waived by the course team
  regression_directory: generated-regressions
  independent_reference_command: []
