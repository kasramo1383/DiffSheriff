version: '2.0'
target:
  name: zlib-cve-2018-25032
  language: c
  repository_path: repository
  base_ref: '88fb854d151473d88294f56da390408c61be23a8'
  patch_ref: '73baa13a5ce13ab49e2b6eb85d2269148b283185'
  baseline_signature:
    error_type: out-of-bounds
    file: trees.c
    function: compress_block
    line: 1092
build:
  timeout_seconds: 120
  clean_command: make clean
  release:
    command: make release CC=clang 'CFLAGS=-O2 -I. -DHAVE_UNISTD_H'
    binary_path: driver_release
  sanitized:
    command: make sanitized CC=clang 'SANFLAGS=-fsanitize=address,undefined -g -O1 -I. -DHAVE_UNISTD_H'
    binary_path: driver_sanitized
execution:
  image: diffsheriff:local
  timeout_seconds: 5
  input_method: file
  file_argument_flag: --file
  fixed_arguments: []
  memory_mb: 2048
  cpus: 2
  pids_limit: 128
  output_limit_bytes: 1048576
  environment_variables:
    ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:symbolize=1:external_symbolizer_path=/usr/bin/llvm-symbolizer
    UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:external_symbolizer_path=/usr/bin/llvm-symbolizer
hardening_baseline:
  enforce_nx: false
  enforce_pie: false
  min_relro: none
  enforce_canary: false
test_suites:
  valid_directory: suites/valid
  boundary_directory: suites/boundary
  malicious_directory: suites/invalid
  expectations: suites/expected.json
  provenance: Documented bounded zlib completion/status contract in docs/target_scenarios.md; instructor approval waived by the course team
  regression_directory: generated-regressions
  independent_reference_command: ["python3", "reference.py"]
