[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diffsheriff"
version = "0.1.0"
description = "Automated Security Patch Validation and Regression Testing in CI/CD"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kasra Montazeri", email = "montazerikasra@gmail.com" }
]
dependencies = [
    "pyyaml>=6.0",
    "pyelftools>=0.29",
    "click>=8.1",
    "rich>=13.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0"
]

[project.scripts]
diffsheriff = "diffsheriff.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["diffsheriff*"]
