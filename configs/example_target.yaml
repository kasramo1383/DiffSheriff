# Schema example only. No corresponding target is present or approved.
version: "1.0"

target:
  name: "example-target"
  language: "c"
  repository_path: "targets/example_target"

build:
  clean_command: "make clean"
  release:
    command: "make release"
    binary_path: "bin/example_target"
  sanitized:
    command: "make sanitized"
    binary_path: "bin/example_target_asan"

execution:
  timeout_seconds: 5.0
  input_method: "file"
  file_argument_flag: "--file"
  fixed_arguments: []
  environment_variables:
    ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1:symbolize=1"
    UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"

hardening_baseline:
  enforce_nx: true
  enforce_pie: true
  min_relro: "full"
  enforce_canary: true

test_suites:
  valid_directory: "tests/valid"
  boundary_directory: "tests/boundary"
  malicious_directory: "tests/malicious"
  ground_truth:
    independent_reference_command: "./tests/reference_oracle {input} {stdout} {exit_code}"
